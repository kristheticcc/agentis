<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AGENTIS | Trial Matcher</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f6f8fc; color: #172033; }
      body { margin: 0; }
      main { max-width: 900px; margin: 0 auto; padding: 56px 24px 80px; }
      h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: -0.05em; }
      .lead { color: #536077; max-width: 650px; line-height: 1.55; }
      form, .trial { background: #fff; border: 1px solid #dce3ef; border-radius: 14px; box-shadow: 0 4px 16px #1b31520a; }
      form { padding: 22px; margin-top: 28px; }
      label { font-weight: 650; display: block; margin-bottom: 8px; }
      textarea { box-sizing: border-box; width: 100%; min-height: 150px; resize: vertical; border: 1px solid #b9c4d7; border-radius: 9px; padding: 12px; font: inherit; line-height: 1.45; }
      button { margin-top: 14px; border: 0; border-radius: 8px; padding: 11px 17px; background: #1d4ed8; color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
      button:disabled { opacity: .65; cursor: wait; }
      #status { min-height: 1.4em; color: #536077; margin: 18px 0; }
      #results { display: grid; gap: 14px; }
      .trial { padding: 20px; }
      .trial h2 { margin: 0; font-size: 1.13rem; }
      .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: #536077; font-size: .9rem; margin: 8px 0 12px; }
      .rank { background: #dbeafe; color: #1e40af; border-radius: 100px; padding: 3px 8px; font-weight: 700; }
      .trial p { line-height: 1.5; margin: 10px 0; }
      .trial a { color: #1d4ed8; }
      .reason { color: #536077; }
    </style>
  </head>
  <body>
    <main>
      <h1>AGENTIS</h1>
      <p class="lead">Describe the patient’s diagnosis, treatment history, age, location, and any relevant details. AGENTIS will rank potential trial matches.</p>
      <form id="trial-form">
        <label for="patient-message">Patient information</label>
        <textarea id="patient-message" name="message" required placeholder="Example: 61 year old male with stage 2 pancreatic cancer, currently taking gemcitabine, no prior radiation ..."></textarea>
        <button type="submit">Find matching trials</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="results" aria-live="polite" aria-label="Ranked trial results"></section>
      <footer>Built by Krish Makwana</footer>
    </main>
    <script src="{{ url_for('static', path='app.js') }}" defer></script>
  </body>
</html>
